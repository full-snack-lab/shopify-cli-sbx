# Smoke-test this plugin against Shopify CLI without a real sandbox.
#
# Forces activation via SHOPIFY_CLI_SBX=1. Does not require Partner auth or
# egress-restricted networking. Scheduled `latest` failures usually mean an
# upstream CLI change broke our SHOPIFY_CLI_CLOUDFLARED_PATH seam.

name: CLI compat

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily — catch @shopify/cli@latest regressions.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  compat:
    name: "@shopify/cli@${{ matrix.cli_version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned = last verified line from README; latest = upstream watch.
        cli_version: ["4.6.1", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install package deps
        run: npm ci

      - name: Build plugin + oclif manifest
        run: npm run build

      - name: Install Shopify CLI
        run: npm install -g "@shopify/cli@${{ matrix.cli_version }}"

      - name: Disable CLI auto-upgrade
        # Belt-and-suspenders: GHA sets CI=true (CLI skips upgrades in CI),
        # but pin explicitly so a future CLI change cannot float the matrix.
        run: shopify config autoupgrade off

      - name: Show CLI version
        run: shopify version

      - name: Link plugin into CLI
        run: shopify plugins link .

      - name: Assert shim activates under forced sbx
        run: bash scripts/ci-assert-shim.sh

      - name: Prove cloudflared download path works
        run: node dist/sbx-cloudflared.cjs --sbx-download-only

      - name: Confirm CLI still documents CLOUDFLARED_PATH seam
        run: |
          prefix="$(npm root -g)"
          if ! grep -R --include='*.js' --include='*.mjs' --include='*.cjs' -l 'SHOPIFY_CLI_CLOUDFLARED_PATH' "$prefix" >/dev/null; then
            echo "SHOPIFY_CLI_CLOUDFLARED_PATH not found under global npm root: $prefix" >&2
            exit 1
          fi
          echo "seam present under $prefix"
